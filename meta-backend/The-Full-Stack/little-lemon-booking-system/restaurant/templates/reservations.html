<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Make a Reservation</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Make a Reservation</h1>
      <form id="booking-form">
        <input type="text" id="full-name" placeholder="Full Name" required />
        <input type="date" id="reservation-date" required />
        <select id="reservation-slot" required></select>
        <button type="submit">Book</button>
      </form>
      <div id="message"></div>
      <div id="total-count" class="total-count"></div>
      <div id="timeline" class="timeline"></div>
    </div>
    <script>
      const slots = [
        "12:00 PM",
        "1:00 PM",
        "2:00 PM",
        "3:00 PM",
        "4:00 PM",
        "5:00 PM",
        "6:00 PM",
        "7:00 PM"
      ];
      const dateInput = document.getElementById("reservation-date");
      const slotSelect = document.getElementById("reservation-slot");
      const messageDiv = document.getElementById("message");
      const form = document.getElementById("booking-form");
      const totalCount = document.getElementById("total-count");
      const timelineDiv = document.getElementById("timeline");

      function populateSlots(bookedSlots) {
        slotSelect.innerHTML = "";
        slots.forEach((slot) => {
          const option = document.createElement("option");
          option.value = slot;
          option.textContent = slot;
          if (bookedSlots.includes(slot)) {
            option.disabled = true;
          }
          slotSelect.appendChild(option);
        });
      }

      async function fetchBookings(date) {
        const response = await fetch(
          `/restaurant/booking/?reservation_date=${date}`
        );
        return await response.json();
      }

      function renderTimeline(bookings) {
        timelineDiv.innerHTML = "";
        slots.forEach((slot) => {
          const itemDiv = document.createElement("div");
          itemDiv.classList.add("timeline-item");
          const slotLabel = document.createElement("div");
          slotLabel.classList.add("slot-label");
          slotLabel.textContent = slot;
          const slotDiv = document.createElement("div");
          slotDiv.classList.add("timeline-slot");
          const booking = bookings.find((b) => b.reservation_slot === slot);
          if (booking) {
            slotDiv.classList.add("timeline-booked");
            const label = document.createElement("span");
            label.classList.add("booking-label");
            label.textContent = booking.full_name;
            slotDiv.appendChild(label);
          }
          itemDiv.appendChild(slotLabel);
          itemDiv.appendChild(slotDiv);
          timelineDiv.appendChild(itemDiv);
        });
      }

      async function updateSlots() {
        const date = dateInput.value;
        const bookings = await fetchBookings(date);
        const bookedSlots = bookings.map((b) => b.reservation_slot);
        // display status and count
        if (bookings.length === 0) {
          messageDiv.textContent = "No bookings for this date.";
        } else {
          messageDiv.textContent = "";
        }
        totalCount.textContent = `Total Bookings: ${bookings.length}`;
        populateSlots(bookedSlots);
        renderTimeline(bookings);
      }

      document.addEventListener("DOMContentLoaded", () => {
        const today = new Date().toISOString().split("T")[0];
        dateInput.value = today;
        updateSlots();
      });

      dateInput.addEventListener("change", updateSlots);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fullName = document.getElementById("full-name").value;
        const reservationDate = dateInput.value;
        const reservationSlot = slotSelect.value;
        const response = await fetch("/restaurant/booking/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            full_name: fullName,
            reservation_date: reservationDate,
            reservation_slot: reservationSlot
          })
        });
        if (response.ok) {
          messageDiv.textContent = "Booking successful!";
          updateSlots();
          form.reset();
          dateInput.value = new Date().toISOString().split("T")[0];
        } else {
          const err = await response.json();
          messageDiv.textContent = err.detail || JSON.stringify(err);
        }
      });
    </script>
  </body>
</html>
